name: Publish release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish to npm (latest), for example v1.2.3'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs the dependencies' code, so it gets no publication rights.
  build:
    if: github.ref == format('refs/tags/{0}', inputs.tag) && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      published: ${{ steps.publication.outputs.published }}
      released: ${{ steps.publication.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve and validate the requested tag
        id: target
        run: node scripts/release.ts target "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Require successful CI on the exact commit
        run: |
          test "$COMMIT" = "$GITHUB_SHA"
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=main" | jq --slurp --raw-output '[.[].workflow_runs[]] | max_by(.run_number) | .conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "The latest CI run for $COMMIT on main must succeed before publication." >&2
            exit 1
          fi
          printf '### Publication target\n- Tag: %s\n- Commit: %s\n' "$RELEASE_TAG" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
      - run: npm run check
      - name: Check existing publication and tag identity
        id: publication
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$COMMIT"
          mkdir "$RUNNER_TEMP/release"
          node scripts/release.ts notes "$VERSION" > "$RUNNER_TEMP/release/notes.md"
          published=$(node scripts/release.ts published @hugolopes45/lmsk "$VERSION" "$COMMIT")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          released=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == false) | .id")
          echo "released=$released" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          COMMIT: ${{ steps.target.outputs.commit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/release/notes.md
          if-no-files-found: error
          retention-days: 1

  # Runs no dependency code, so no dependency gets the publication token. It publishes from the git checkout, so npm records gitHead, which the published check of release.ts needs.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/release
      - name: Publish to npm
        if: needs.build.outputs.published == 'false'
        run: npm publish --provenance --ignore-scripts
      - name: Create the GitHub release
        if: needs.build.outputs.released == ''
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
